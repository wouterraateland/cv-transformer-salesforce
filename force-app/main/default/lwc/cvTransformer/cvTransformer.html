<template>
  <template lwc:if={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      class="slds-var-m-around_medium"
      size="large"
    ></lightning-spinner>
  </template>
  <template if:true={iframeUrl}>
    <iframe
      allow="fullscreen"
      allowfullscreen
      src={iframeUrl}
      style="
        border: none;
        border-radius: 3px;
        height: calc(100vh - 240px);
        width: 100%;
      "
    ></iframe>
  </template>
</template>
