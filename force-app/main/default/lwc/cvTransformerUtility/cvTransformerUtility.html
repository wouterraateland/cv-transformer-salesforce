<template>
  <template lwc:if={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      class="slds-var-m-around_medium"
      size="large"
    ></lightning-spinner>
  </template>
  <template lwc:if={isSetup}>
    <h2 class="slds-var-m-around_medium slds-text-heading_medium">
      Setup CV-Transformer
    </h2>
    <form onsubmit={onSetupSubmit}>
      <lightning-input
        class="slds-var-m-around_medium"
        label="CV-Transformer API Key"
        name="api_key"
        placeholder="Enter API Key"
        required
        type="text"
      ></lightning-input>
      <lightning-layout
        class="slds-var-m-around_medium"
        horizontal-align="end"
        style="gap: 0.5rem"
      >
        <template lwc:if={organization_id}>
          <lightning-button
            label="Cancel"
            onclick={onSetupCancel}
            type="button"
            variant="container"
          ></lightning-button>
        </template>
        <lightning-button
          label="Save"
          type="submit"
          variant="brand"
        ></lightning-button>
      </lightning-layout>
      <template lwc:if={organization_id}></template>
      <template lwc:else>
        <p class="slds-var-m-around_medium">
          Don't have a CV-Transformer account yet?
          <a
            class="slds-text-link"
            href="https://www.cv-transformer.com/admin"
            target="_blank"
          >
            Sign-up
          </a>
        </p>
      </template>
    </form>
  </template>
  <template lwc:if={isEdit}>
    <div class="slds-var-m-around_medium">
      <lightning-file-upload
        class="file-upload"
        accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp"
        label="Upload CV"
        name="cv"
        onuploadfinished={onCvUpload}
      ></lightning-file-upload>
    </div>
    <div class="slds-var-m-around_medium">
      <lightning-button
        icon-name="utility:settings"
        label="Change API key"
        onclick={onApiKeyChange}
        type="button"
        variant="container"
      ></lightning-button>
    </div>
  </template>
  <template lwc:if={error}>
    <p class="slds-var-m-around_medium slds-text-color_error">{error}</p>
  </template>
</template>
