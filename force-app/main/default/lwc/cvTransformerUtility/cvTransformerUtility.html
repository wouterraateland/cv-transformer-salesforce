<template>
  <template lwc:if={isLoading}>
    <lightning-spinner
      alternative-text="Loading"
      class="slds-var-m-around_medium"
      size="large"
    ></lightning-spinner>
  </template>
  <template if:true={url}>
    <iframe
      allow="fullscreen"
      allowfullscreen
      src={url}
      style="border: none; height: 100%; width: 100%"
    ></iframe>
  </template>
</template>
